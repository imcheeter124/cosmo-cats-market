name: Build and Test Coverage

on:
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, run tests and verify coverage
        run: ./gradlew build

      - name: Publish test summary
        if: always()
        run: |
          if [ -f build/reports/tests/test-summary.md ]; then
            cat build/reports/tests/test-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: build/reports/coverage/
          if-no-files-found: warn
