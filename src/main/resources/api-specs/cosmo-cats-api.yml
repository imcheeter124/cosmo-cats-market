openapi: 3.0.3
info:
  title: Cosmo Cats Intergalactic Marketplace API
  version: 1.0.0
  description: API for managing cosmic products

servers:
  - url: http://localhost:8080

paths:
  /api/v1/products:
    get:
      summary: Get paginated list of products
      operationId: getProducts
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Page of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          description: Invalid pagination parameters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    post:
      summary: Create product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Product created
          headers:
            Location:
              description: URL of the created product
              schema:
                type: string
                example: /api/v1/products/42
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Get product by id
      operationId: getProductById
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Product not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    put:
      summary: Update product
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Product not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
    delete:
      summary: Delete product
      operationId: deleteProduct
      responses:
        '204':
          description: Product deleted (also returned if it did not exist)

components:
  schemas:
    ProductRequest:
      type: object
      required: [name, price, categoryId]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          example: Star Milk
        description:
          type: string
          maxLength: 1000
          example: Fresh milk from the Milky Way
        price:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
          description: Price with at most 10 integer digits and 2 decimal places
          example: 12.50
        categoryId:
          type: integer
          format: int64
          example: 1

    ProblemDetail:
      type: object
      description: Error format according to RFC 9457
      properties:
        type:
          type: string
          example: https://cosmo-cats.market/errors/validation
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Field 'price' must be greater than 0.
        instance:
          type: string
          example: /api/v1/products

    ProductResponse:
      type: object
      required: [id, name, price, categoryId]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Star Milk
        description:
          type: string
          example: Fresh milk from the Milky Way
        price:
          type: number
          example: 12.50
        categoryId:
          type: integer
          format: int64
          example: 1

    ProductPage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 100



